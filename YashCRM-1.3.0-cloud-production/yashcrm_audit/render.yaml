databases:
  - name: yashcrm-db
    databaseName: yashcrm
    user: yashcrm

services:
  - type: web
    name: yashcrm
    runtime: docker
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yashcrm-db
          property: connectionString
      - key: ENABLE_AUTH
        value: "true"
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: SEED_DEMO_DATA
        value: "false"
