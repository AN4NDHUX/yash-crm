services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yashcrm
      POSTGRES_USER: yashcrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yashcrm -d yashcrm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  crm:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://yashcrm:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/yashcrm
      ENABLE_AUTH: "true"
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-change-this-to-a-long-password}
      PUBLIC_URL: ${PUBLIC_URL:-http://yashcrm.local:8000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-yashcrm.local,localhost,127.0.0.1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://yashcrm.local:8000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
