<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrandOrbs Neuform Loader</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
  }
  body {
    display: grid;
    place-items: center;
  }
  .brand-orbs {
    position: relative;
    width: 128px;
    height: 128px;
    display: grid;
    place-items: center;
    isolation: isolate;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 128px;
    height: 128px;
    display: block;
    background: transparent;
  }
  .letter-logo {
    position: relative;
    z-index: 2;
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    color: #5b5df6;
    font-family: "Manrope", "Segoe UI", Arial, sans-serif;
    font-size: 39px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -.10em;
    transform: translateX(-1px);
    text-shadow:
      0 2px 8px rgba(33,95,224,.14),
      0 0 18px rgba(91,93,246,.13);
    background: transparent;
    border: 0;
    box-shadow: none;
    user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="brand-orbs" aria-label="Yash CRM BrandOrbs neuform loader">
  <canvas id="brandOrbsCanvas" width="128" height="128" aria-hidden="true"></canvas>
  <span class="letter-logo" aria-hidden="true">V</span>
</div>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("brandOrbsCanvas");
  const ctx = canvas.getContext("2d", { alpha: true });
  const SIZE = 128;
  const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const CENTER = SIZE / 2;
  const TAU = Math.PI * 2;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  canvas.width = SIZE * DPR;
  canvas.height = SIZE * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  let frameId = 0;
  let t = 0;
  let interaction = 0;
  let interactionTarget = 0;

  const particleSeed = [
    [0.02, 33, 2.8, .58], [0.08, 47, 1.8, .36], [0.14, 39, 2.2, .46],
    [0.20, 51, 1.5, .30], [0.27, 35, 2.6, .54], [0.34, 45, 1.8, .35],
    [0.41, 40, 2.4, .50], [0.49, 52, 1.5, .28], [0.56, 36, 2.5, .52],
    [0.63, 46, 1.9, .38], [0.70, 41, 2.7, .56], [0.78, 50, 1.6, .30],
    [0.85, 37, 2.2, .48], [0.92, 44, 1.8, .36]
  ];

  function glow(x, y, radius, alpha) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
    g.addColorStop(0, `rgba(117,177,255,${.34 * alpha})`);
    g.addColorStop(.42, `rgba(68,128,246,${.16 * alpha})`);
    g.addColorStop(1, "rgba(68,128,246,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, TAU);
    ctx.fill();
  }

  function drawParticleCloud(rotation) {
    for (let i = 0; i < particleSeed.length; i++) {
      const [phase, baseRadius, size, alpha] = particleSeed[i];
      const angle = phase * TAU + rotation * .45 + Math.sin(t * .018 + i * .7) * .10;
      const radius = baseRadius + Math.sin(t * .026 + i) * 2.5;
      const x = CENTER + Math.cos(angle) * radius;
      const y = CENTER + Math.sin(angle) * radius;

      glow(x, y, size * 5.2, alpha);
      ctx.fillStyle = `rgba(105,170,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, TAU);
      ctx.fill();
    }
  }

  function drawCenterHalo(pulse) {
    const g = ctx.createRadialGradient(CENTER, CENTER, 4, CENTER, CENTER, 39 + pulse * 2);
    g.addColorStop(0, "rgba(95,103,250,.08)");
    g.addColorStop(.52, "rgba(64,126,245,.06)");
    g.addColorStop(1, "rgba(64,126,245,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(CENTER, CENTER, 41 + pulse * 2, 0, TAU);
    ctx.fill();

    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(82,143,251,.16)";
    ctx.beginPath();
    ctx.arc(CENTER, CENTER, 28 + pulse * 1.3, 0, TAU);
    ctx.stroke();

    ctx.strokeStyle = "rgba(125,179,255,.08)";
    ctx.beginPath();
    ctx.arc(CENTER, CENTER, 36 + pulse * 1.6, 0, TAU);
    ctx.stroke();
  }

  function drawChevron(angle, radius, scale, alpha) {
    const x = CENTER + Math.cos(angle) * radius;
    const y = CENTER + Math.sin(angle) * radius;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle + Math.PI / 2);

    const g = ctx.createLinearGradient(0, -8, 0, 8);
    g.addColorStop(0, `rgba(244,249,255,${alpha})`);
    g.addColorStop(.46, `rgba(135,190,255,${alpha * .94})`);
    g.addColorStop(1, `rgba(61,120,241,${alpha * .68})`);

    ctx.fillStyle = g;
    ctx.shadowColor = `rgba(66,129,246,${alpha * .35})`;
    ctx.shadowBlur = 9;

    const w = 7.4 * scale;
    const h = 8.6 * scale;
    const inner = 3.3 * scale;

    ctx.beginPath();
    ctx.moveTo(-w, 1.8 * scale);
    ctx.lineTo(0, -h);
    ctx.lineTo(w, 1.8 * scale);
    ctx.lineTo(inner, 4.8 * scale);
    ctx.lineTo(0, -.5 * scale);
    ctx.lineTo(-inner, 4.8 * scale);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawNeuform(rotation, pulse) {
    const radius = 31.5 + pulse * 1.3;
    for (let i = 0; i < 8; i++) {
      const angle = rotation + i * (TAU / 8);
      const wave = Math.sin(t * .042 + i * .82);
      const scale = .72 + wave * .025 + interaction * .035;
      const alpha = .74 + wave * .08 + interaction * .07;
      const x = CENTER + Math.cos(angle) * radius;
      const y = CENTER + Math.sin(angle) * radius;
      glow(x, y, 11, .22 + interaction * .05);
      drawChevron(angle, radius, scale, alpha);
    }
  }

  function render() {
    ctx.clearRect(0, 0, SIZE, SIZE);

    interaction += (interactionTarget - interaction) * .08;
    const pulse = .5 + .5 * Math.sin(t * .045);
    const rotation = reduceMotion ? .18 : t * (.0105 + interaction * .0045);

    drawParticleCloud(rotation);
    drawCenterHalo(pulse);
    drawNeuform(rotation, pulse);

    if (!reduceMotion) {
      t += 1;
      frameId = requestAnimationFrame(render);
    }
  }

  canvas.addEventListener("pointerenter", () => { interactionTarget = 1; });
  canvas.addEventListener("pointerleave", () => { interactionTarget = 0; });
  canvas.addEventListener("pointermove", () => { interactionTarget = 1; });

  render();

  window.addEventListener("beforeunload", () => cancelAnimationFrame(frameId));
})();
</script>
</body>
</html>
