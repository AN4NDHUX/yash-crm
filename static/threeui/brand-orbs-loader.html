<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yash CRM Particle Loader</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
  }
  body {
    display: grid;
    place-items: center;
  }
  .particle-stage {
    position: relative;
    width: 112px;
    height: 112px;
    overflow: visible;
    isolation: isolate;
  }
  .particle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--size);
    height: var(--size);
    margin-left: calc(var(--size) / -2);
    margin-top: calc(var(--size) / -2);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(108,174,255,.98) 0 22%, rgba(23,105,224,.8) 35%, rgba(23,105,224,.12) 72%, transparent 76%);
    box-shadow: 0 0 10px rgba(23,105,224,.28);
    opacity: 0;
    transform: rotate(var(--angle)) translateX(var(--radius)) scale(.55);
    animation: particle-orbit var(--duration) ease-in-out var(--delay) infinite;
    will-change: transform, opacity;
  }
  .particle.soft {
    background: radial-gradient(circle, rgba(255,255,255,.95) 0 18%, rgba(125,187,255,.64) 38%, transparent 74%);
    box-shadow: 0 0 13px rgba(125,187,255,.32);
  }
  .halo {
    position: absolute;
    inset: 19px;
    border-radius: 50%;
    border: 1px solid rgba(23,105,224,.13);
    box-shadow: 0 0 30px rgba(23,105,224,.08);
    animation: halo-pulse 1.9s ease-in-out infinite;
  }
  .halo::before,
  .halo::after {
    content: "";
    position: absolute;
    inset: -9px;
    border-radius: 50%;
    border: 1px solid rgba(23,105,224,.08);
  }
  .halo::after {
    inset: -18px;
    opacity: .55;
  }
  @keyframes particle-orbit {
    0% {
      opacity: 0;
      transform: rotate(var(--angle)) translateX(calc(var(--radius) * .55)) scale(.4);
    }
    18% { opacity: .85; }
    48% {
      opacity: 1;
      transform: rotate(calc(var(--angle) + 35deg)) translateX(var(--radius)) scale(1);
    }
    82% { opacity: .58; }
    100% {
      opacity: 0;
      transform: rotate(calc(var(--angle) + 88deg)) translateX(calc(var(--radius) * 1.12)) scale(.5);
    }
  }
  @keyframes halo-pulse {
    0%,100% { transform: scale(.92); opacity: .28; }
    50% { transform: scale(1.08); opacity: .72; }
  }
  @media (prefers-reduced-motion: reduce) {
    .particle, .halo { animation: none !important; }
    .particle { opacity: .48; }
    .halo { opacity: .4; }
  }
</style>
</head>
<body>
<div class="particle-stage" aria-hidden="true">
  <span class="halo"></span>
  <span class="particle" style="--angle:0deg;--radius:34px;--size:5px;--duration:2.1s;--delay:-.2s"></span>
  <span class="particle soft" style="--angle:28deg;--radius:43px;--size:4px;--duration:2.8s;--delay:-1.4s"></span>
  <span class="particle" style="--angle:56deg;--radius:38px;--size:6px;--duration:2.5s;--delay:-.8s"></span>
  <span class="particle soft" style="--angle:84deg;--radius:47px;--size:3px;--duration:3.1s;--delay:-2.2s"></span>
  <span class="particle" style="--angle:112deg;--radius:35px;--size:5px;--duration:2.4s;--delay:-1.1s"></span>
  <span class="particle soft" style="--angle:140deg;--radius:45px;--size:4px;--duration:2.9s;--delay:-.5s"></span>
  <span class="particle" style="--angle:168deg;--radius:39px;--size:6px;--duration:2.6s;--delay:-1.8s"></span>
  <span class="particle soft" style="--angle:196deg;--radius:48px;--size:3px;--duration:3.2s;--delay:-.9s"></span>
  <span class="particle" style="--angle:224deg;--radius:36px;--size:5px;--duration:2.2s;--delay:-1.5s"></span>
  <span class="particle soft" style="--angle:252deg;--radius:44px;--size:4px;--duration:2.7s;--delay:-2.0s"></span>
  <span class="particle" style="--angle:280deg;--radius:40px;--size:6px;--duration:2.5s;--delay:-.3s"></span>
  <span class="particle soft" style="--angle:308deg;--radius:46px;--size:3px;--duration:3s;--delay:-1.7s"></span>
  <span class="particle" style="--angle:336deg;--radius:37px;--size:5px;--duration:2.3s;--delay:-1.0s"></span>
</div>
</body>
</html>
