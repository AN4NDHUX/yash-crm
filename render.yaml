databases:
  - name: yashcrm-db
    databaseName: yashcrm
    user: yashcrm
    ipAllowList: []

services:
  - type: web
    name: yashcrm
    runtime: docker
    healthCheckPath: /ready
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yashcrm-db
          property: connectionString
      - key: ENABLE_AUTH
        value: "true"
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: yashcrm
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: SEED_DEMO_DATA
        value: "false"
      - key: YASHCRM_AI_EXCEPTIONS_ENABLED
        value: "false"
