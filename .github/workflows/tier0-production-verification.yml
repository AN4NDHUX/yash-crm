name: Tier 0 Production Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_BASE_URL: https://yashcrm-production.up.railway.app
      PRODUCTION_ADMIN_USERNAME: ${{ secrets.PRODUCTION_ADMIN_USERNAME }}
      PRODUCTION_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ADMIN_PASSWORD }}
      PRODUCTION_SMOKE_USER_A_IDENTIFIER: ${{ secrets.PRODUCTION_SMOKE_USER_A_IDENTIFIER }}
      PRODUCTION_SMOKE_USER_A_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_USER_A_PASSWORD }}
      PRODUCTION_SMOKE_USER_B_IDENTIFIER: ${{ secrets.PRODUCTION_SMOKE_USER_B_IDENTIFIER }}
      PRODUCTION_SMOKE_USER_B_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_USER_B_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve expected release
        shell: bash
        run: |
          set -euo pipefail
          echo "EXPECTED_APP_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          HEAD="$(python -m alembic heads | awk 'NR==1 {print $1}')"
          test -n "$HEAD"
          echo "EXPECTED_MIGRATION_REVISION=$HEAD" >> "$GITHUB_ENV"

      - name: Validate verification credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_ADMIN_USERNAME"
          test -n "$PRODUCTION_ADMIN_PASSWORD"
          test -n "$PRODUCTION_SMOKE_USER_A_IDENTIFIER"
          test -n "$PRODUCTION_SMOKE_USER_A_PASSWORD"
          test -n "$PRODUCTION_SMOKE_USER_B_IDENTIFIER"
          test -n "$PRODUCTION_SMOKE_USER_B_PASSWORD"

      - name: Verify Railway production
        run: python scripts/verify_production.py
