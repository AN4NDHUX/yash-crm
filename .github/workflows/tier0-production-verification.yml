name: Tier 0 Production Verification

# Production certification is an explicit release action after CI and Railway converge.
# Automatic runs for superseded CI commits never certify the currently deployed release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier0-production-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://yashcrm-production.up.railway.app' }}
      PRODUCTION_ADMIN_USERNAME: ${{ secrets.PRODUCTION_ADMIN_USERNAME }}
      PRODUCTION_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ADMIN_PASSWORD }}
      PRODUCTION_SMOKE_USER_A_IDENTIFIER: ${{ secrets.PRODUCTION_SMOKE_USER_A_IDENTIFIER }}
      PRODUCTION_SMOKE_USER_A_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_USER_A_PASSWORD }}
      PRODUCTION_SMOKE_USER_B_IDENTIFIER: ${{ secrets.PRODUCTION_SMOKE_USER_B_IDENTIFIER }}
      PRODUCTION_SMOKE_USER_B_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_USER_B_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve expected release
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.sha }}"
          HEAD="$(python -m alembic heads | awk 'NR==1 {print $1}')"
          test -n "$EXPECTED_SHA"
          test -n "$HEAD"
          echo "EXPECTED_APP_REVISION=$EXPECTED_SHA" >> "$GITHUB_ENV"
          echo "EXPECTED_MIGRATION_REVISION=$HEAD" >> "$GITHUB_ENV"

      - name: Validate production verification credentials
        shell: bash
        run: |
          set -euo pipefail
          required=(
            PRODUCTION_ADMIN_USERNAME
            PRODUCTION_ADMIN_PASSWORD
            PRODUCTION_SMOKE_USER_A_IDENTIFIER
            PRODUCTION_SMOKE_USER_A_PASSWORD
            PRODUCTION_SMOKE_USER_B_IDENTIFIER
            PRODUCTION_SMOKE_USER_B_PASSWORD
          )
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Wait for Railway deployment
        run: python scripts/wait_for_production.py

      - name: Verify Railway production
        run: python scripts/verify_production.py
