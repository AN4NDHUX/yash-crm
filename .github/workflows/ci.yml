name: CRM Regression Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: crm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yashcrm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yashcrm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt pytest pytest-timeout pip-audit bandit
      - run: python -m playwright install --with-deps chromium
      - id: dependency_scan
        run: python -m pip_audit -r requirements.txt
      - run: bandit -q -r app -lll
      - run: python -m compileall -q app migrations
      - name: Validate all frontend modules
        run: find static/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify PostgreSQL migrations
        id: migrations
        run: python -m alembic upgrade head
        env:
          APP_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yashcrm_ci
          ENABLE_AUTH: "true"
          ALLOWED_HOSTS: localhost
          ADMIN_EMAIL: admin@example.com
          ADMIN_NAME: Administrator
          APP_USERNAME: admin
          APP_PASSWORD: supersecretpass123
          SEED_DEMO_DATA: "false"
      - name: Critical populated module smoke
        run: pytest -q tests/test_full_module_smoke.py --timeout=120

      - name: Browser end-to-end tests (Chromium)
        id: browser
        run: pytest -q tests/test_browser_e2e.py --timeout=180
        env:
          APP_ENV: development
          ENABLE_AUTH: "true"
          APP_USERNAME: admin
          APP_PASSWORD: supersecretpass123

      - name: Full regression suite
        id: regression
        run: pytest -q --timeout=180
        env:
          APP_ENV: development
          ENABLE_AUTH: "true"
          APP_USERNAME: admin
          APP_PASSWORD: supersecretpass123
      - name: Publish independently verifiable test statuses
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          DEPENDENCY_SCAN_OUTCOME: ${{ steps.dependency_scan.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migrations.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        with:
          script: |
            const checks = [
              ['ci/dependency-security', process.env.DEPENDENCY_SCAN_OUTCOME],
              ['ci/postgresql-migrations', process.env.MIGRATION_OUTCOME],
              ['ci/chromium-browser-e2e', process.env.BROWSER_OUTCOME],
              ['ci/full-crm-regression', process.env.REGRESSION_OUTCOME]
            ];
            for (const [statusContext, outcome] of checks) {
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha: context.sha,
                state: outcome === 'success' ? 'success' : 'failure',
                context: statusContext,
                description: outcome === 'success' ? 'Passed on GitHub Actions' : 'Failed or skipped; review Actions job',
                target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }
