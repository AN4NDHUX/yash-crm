name: CRM Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: crm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yashcrm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yashcrm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt pytest pip-audit bandit
      - run: python -m playwright install --with-deps chromium
      - run: python -m pip_audit -r requirements.txt
      - run: bandit -q -r app -lll
      - run: python -m py_compile app/main.py
      - run: node --check static/js/app.js
      - name: Verify PostgreSQL migrations
        run: python -m alembic upgrade head
        env:
          APP_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yashcrm_ci
          ENABLE_AUTH: "true"
          ALLOWED_HOSTS: localhost
          ADMIN_EMAIL: admin@example.com
          ADMIN_NAME: Administrator
          APP_USERNAME: admin
          APP_PASSWORD: supersecretpass123
          SEED_DEMO_DATA: "false"
      - run: pytest -q
        env:
          APP_ENV: development
          ENABLE_AUTH: "true"
          APP_USERNAME: admin
          APP_PASSWORD: supersecretpass123
