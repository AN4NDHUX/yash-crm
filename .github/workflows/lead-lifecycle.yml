name: Lead Lifecycle Regression

on:
  push:
    branches: [main]
    paths:
      - "app/main.py"
      - "app/models.py"
      - "app/services/lead_conversion.py"
      - "app/services/record_deduplication.py"
      - "app/services/import_wizard_routes.py"
      - "migrations/versions/**"
      - "tests/test_lead_stage_promotion.py"
      - "tests/test_lead_conversion_upgrade.py"
      - "tests/test_lead_blueprint_conversion_flow.py"
      - "app/services/blueprint_routes.py"
      - "static/js/app.js"
      - ".github/workflows/lead-lifecycle.yml"
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install regression dependencies
        run: python -m pip install -r requirements-dev.txt pytest pytest-timeout
      - name: Verify Lead promotion, deduplication and existing conversion
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_lead_stage_promotion.py tests/test_lead_conversion_upgrade.py tests/test_lead_blueprint_conversion_flow.py tests/test_crm_stage_timeline.py --timeout=180
