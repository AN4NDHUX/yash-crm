name: Guided CRM Import Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guided-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt pytest pytest-timeout
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test guided imports with backend and Chromium
        run: python -m pytest -q tests/test_guided_import_wizard.py tests/test_browser_guided_import.py --timeout=180
        env:
          PYTHONPATH: .
